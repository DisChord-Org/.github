name: Notify Server

on:
  workflow_call:
    secrets:
      INTERNAL_SECRET:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Server
        env:
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST https://api.theindiebrand.es/versions/update \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg secret "$INTERNAL_SECRET" '{secret: $secret}')"